name: Android CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Any
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANY_KEYSTORE_BASE64: ${{ secrets.ANY_KEYSTORE_BASE64 }}
        run: echo "$ANY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/any-release.jks"

      - name: Build APK
        env:
          ANY_KEYSTORE_FILE: ${{ runner.temp }}/any-release.jks
          ANY_KEYSTORE_PASSWORD: ${{ secrets.ANY_KEYSTORE_PASSWORD }}
          ANY_KEY_ALIAS: any-release
          ANY_KEY_PASSWORD: ${{ secrets.ANY_KEYSTORE_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --console=plain
          else
            ./gradlew assembleDebug --console=plain
          fi

      - name: Upload test APK
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: Any-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Any-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Any ${GITHUB_REF_NAME}" \
            --generate-notes
