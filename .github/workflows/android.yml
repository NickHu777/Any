name: Android CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Any
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANY_KEYSTORE_BASE64: ${{ secrets.ANY_KEYSTORE_BASE64 }}
        run: echo "$ANY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/any-release.jks"

      - name: Build APK
        env:
          ANY_KEYSTORE_FILE: ${{ runner.temp }}/any-release.jks
          ANY_KEYSTORE_PASSWORD: ${{ secrets.ANY_KEYSTORE_PASSWORD }}
          ANY_KEY_ALIAS: any-release
          ANY_KEY_PASSWORD: ${{ secrets.ANY_KEYSTORE_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --console=plain
          else
            ./gradlew assembleDebug --console=plain
          fi

      - name: Upload test APK
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: Any-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Any-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Any ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Mirror source to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          user_json="$(curl -fsSL "https://gitee.com/api/v5/user?access_token=${GITEE_TOKEN}")"
          gitee_owner="$(jq -r '.login' <<<"${user_json}")"
          if [[ -z "${gitee_owner}" || "${gitee_owner}" == "null" ]]; then
            echo "Unable to resolve Gitee account" >&2
            exit 1
          fi
          echo "GITEE_OWNER=${gitee_owner}" >> "${GITHUB_ENV}"

          if ! curl -fsSL "https://gitee.com/api/v5/repos/${gitee_owner}/Any?access_token=${GITEE_TOKEN}" >/dev/null; then
            curl -fsSL -X POST "https://gitee.com/api/v5/user/repos" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "name=Any" \
              --data-urlencode "description=Any domestic mirror" \
              --data-urlencode "private=false" >/dev/null
          fi

          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${gitee_owner}/Any.git"
          git push --mirror gitee

      - name: Create Gitee Release and upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg name "Any ${GITHUB_REF_NAME}" \
            --arg body "Mirrored from GitHub commit ${GITHUB_SHA}." \
            --arg target "${GITHUB_SHA}" \
            '{tag_name:$tag,name:$name,body:$body,target_commitish:$target,prerelease:false}')"
          release="$(curl -fsSL -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/Any/releases?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${release_json}")"
          release_id="$(jq -r '.id' <<<"${release}")"
          if [[ -z "${release_id}" || "${release_id}" == "null" ]]; then
            echo "Unable to create Gitee release" >&2
            exit 1
          fi
          curl -fsSL -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/Any/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}" \
            -F "file=@app/build/outputs/apk/release/app-release.apk" >/dev/null
